<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="15" fill="var(--fg)">① 앞쪽 레일 단면 (왼쪽에서 본 개략도, 분해)</text>

  <!-- top case, drawn lifted -->
  <path d="M60,70 H300 V92 H190 V130 H140 V92 H96 V200 H60 Z" fill="var(--c1)" fill-opacity="0.35" stroke="var(--c1)" stroke-width="1.5"/>
  <text x="200" y="64" fill="var(--muted)">상판</text>

  <!-- bottom case -->
  <path d="M100,245 H124 V300 H200 V314 H124 V362 H470 V380 H100 Z" fill="var(--c2)" fill-opacity="0.35" stroke="var(--c2)" stroke-width="1.5"/>
  <text x="330" y="356" fill="var(--muted)">하판</text>
  <!-- gasket sock + plate -->
  <rect x="138" y="274" width="54" height="26" rx="8" fill="var(--c4)" fill-opacity="0.45" stroke="var(--c4)" stroke-width="1.5"/>
  <rect x="150" y="283" width="320" height="8" fill="var(--c3)" fill-opacity="0.6" stroke="var(--c3)" stroke-width="1.5"/>
  <text x="196" y="268" fill="var(--muted)">가스켓</text>
  <text x="380" y="278" fill="var(--muted)">보강판</text>
  <line x1="30" y1="380" x2="470" y2="380" stroke="var(--fg)" stroke-width="2"/>
  <text x="436" y="396" fill="var(--muted)">책상</text>

  <g stroke="var(--accent)" stroke-width="1.3" fill="none">
    <line x1="60" y1="190" x2="96" y2="190" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="96" y1="200" x2="126" y2="200" stroke-dasharray="3 3"/>
    <line x1="118" y1="92" x2="118" y2="200" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="190" y1="130" x2="214" y2="130" stroke-dasharray="3 3"/>
    <line x1="208" y1="92" x2="208" y2="130" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="96" y1="160" x2="300" y2="160" marker-start="url(#a)" stroke-dasharray="6 4"/>
    <line x1="88" y1="245" x2="88" y2="380" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="84" y1="245" x2="100" y2="245" stroke-dasharray="3 3"/>
    <line x1="192" y1="274" x2="266" y2="274" stroke-dasharray="3 3"/>
    <line x1="260" y1="274" x2="260" y2="380" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="100" y1="232" x2="300" y2="232" marker-start="url(#a)" stroke-dasharray="6 4"/>
  </g>
  <g fill="var(--accent)" font-weight="bold">
    <text x="64" y="216">T2</text>
    <text x="124" y="150">T3</text>
    <text x="214" y="116">T4</text>
    <text x="306" y="164">T1 → 반대쪽 벽 안쪽까지</text>
    <text x="54" y="318">B2</text>
    <text x="266" y="336">B3</text>
    <text x="306" y="236">B1 → 반대쪽 바깥까지</text>
  </g>

  <text x="520" y="34" font-size="15" fill="var(--fg)">② 상판을 위에서 본 모습</text>
  <rect x="520" y="110" width="410" height="162" rx="12" fill="var(--c1)" fill-opacity="0.25" stroke="var(--c1)" stroke-width="1.5"/>
  <path d="M536,124 H914 V212 H874 V252 H576 V212 H536 Z" fill="var(--surface)" stroke="var(--c1)" stroke-width="1.5"/>
  <g fill="var(--warning)">
    <rect x="644" y="113" width="10" height="7"/>
    <rect x="794" y="113" width="10" height="7"/>
    <rect x="644" y="259" width="10" height="7"/>
    <rect x="794" y="259" width="10" height="7"/>
  </g>
  <text x="664" y="104" fill="var(--warning)">볼캐치 4개 (앞 2, 뒤 2)</text>
  <rect x="556" y="106" width="30" height="8" fill="none" stroke="var(--error)" stroke-dasharray="3 2"/>
  <text x="530" y="96" fill="var(--error)">T10 USB 위치?</text>

  <g stroke="var(--accent)" stroke-width="1.3" fill="none">
    <line x1="536" y1="150" x2="914" y2="150" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="760" y1="124" x2="760" y2="252" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="520" y1="276" x2="520" y2="310" stroke-dasharray="3 3"/>
    <line x1="930" y1="276" x2="930" y2="310" stroke-dasharray="3 3"/>
    <line x1="520" y1="304" x2="930" y2="304" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="649" y1="270" x2="649" y2="290" stroke-dasharray="3 3"/>
    <line x1="520" y1="286" x2="649" y2="286" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="934" y1="110" x2="952" y2="110" stroke-dasharray="3 3"/>
    <line x1="934" y1="272" x2="952" y2="272" stroke-dasharray="3 3"/>
    <line x1="946" y1="110" x2="946" y2="272" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <g fill="var(--accent)" font-weight="bold">
    <text x="690" y="144">T8 키캡 구멍</text>
    <text x="766" y="200">T8</text>
    <text x="541" y="236">T9</text>
    <text x="566" y="282">T6</text>
    <text x="700" y="322">T7 바깥 가로</text>
    <text x="952" y="196">T7</text>
  </g>
  <text x="520" y="350" fill="var(--muted)">← 왼쪽</text>
  <text x="725" y="350" fill="var(--muted)" text-anchor="middle">앞 (타이핑하는 쪽)</text>
  <text x="930" y="350" fill="var(--muted)" text-anchor="end">오른쪽 →</text>
</svg>
